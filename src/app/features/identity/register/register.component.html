<main class="register-page">
  <section class="register-card">
    <a class="back-link" routerLink="/login">← Back to login</a>
    <h1>Create account</h1>
    <p class="description">Register to start learning.</p>
    <form [formGroup]="registrationForm" novalidate (ngSubmit)="submit()">
      <label
        >Name<input
          type="text"
          formControlName="name"
          autocomplete="name"
          placeholder="Enter your name"
      /></label>
      <label
        >Email<input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Enter your email"
      /></label>
      <label
        >Password<input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="At least 8 characters"
      /></label>
      <label
        >Confirm password<input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Repeat your password"
      /></label>
      <label
        >Role<select formControlName="role">
          <option value="learner">Learner</option>
          <option value="instructor">Instructor</option>
          <option value="management">Management</option>
        </select></label
      >
      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }
      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>
    <p class="login-link">Already have an account? <a routerLink="/login">Login</a></p>
  </section>
</main>
